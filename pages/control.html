<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejecución de Clases - Escuela Digital</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../image/EscuelaIco-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../image/EscuelaIco-16x16.png">
    <link rel="shortcut icon" href="../image/EscuelaIco.ico">
    <link rel="apple-touch-icon" href="../image/EscuelaIco-apple.png">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Escuela Digital">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css?v=3.4">
</head>
<body>
    <div class="app-body">
        <main id="main-content" class="app-main">
            <!-- Header de Sección -->
            <div class="header-seccion">
                <div class="header-seccion-main">
                    <span class="header-icon">
                        <svg class="header-icon-svg" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    </span>
                    <div class="header-seccion-text">
                        <h2 id="titulo-control-header">Ejecución</h2>
                        <p>Control de ejecución de clases.</p>
                    </div>
                </div>
                <div class="header-action-container">
                    <span class="control-counter-badge">
                        <span class="counter-dot"></span>
                        <span id="control-contador-texto">Cargando clases...</span>
                    </span>
                </div>
            </div>

            <!-- Filtros -->
            <div class="filters-bar" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; align-items: flex-start;">
                <div style="flex: 1 1 100%; min-width: 140px;">
                    <input type="text" id="filter-search" class="form-control" placeholder="Buscar Fecha, Clase o Profesor...">
                </div>
                <div style="width: 320px; max-width: 100%;">
                    <select id="filter-asignacion" class="form-select">
                        <option value="">Asignaciones</option>
                    </select>
                </div>
                <div style="width: 180px;">
                    <select id="filter-estatus" class="form-select">
                        <option value="">Estatus</option>
                    </select>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="table-responsive table-control-scroll">
                <table class="data-table" id="tabla-control">
                    <thead>
                        <tr>
                            <th>Estatus</th>    
                            <th>Fecha</th>
                            <th># Clase</th>
                            <th>Clase</th>
                            <th style="width: 90px; text-align: center;">Foto</th>
                            <th>Profesor</th>
                            <th>Observaciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-control-body">
                        <tr>
                            <td colspan="7" class="loading">Consultando Ejecución de Clases...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Modal Editar Ejecución -->
            <div id="modal-control" class="modal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modal-control-title">Editar Ejecución de Clase</h3>
                        <button id="modal-control-close" class="modal-close">✕</button>
                    </div>
                    <div class="modal-body">
                        <form id="form-control">
                            <input type="hidden" id="control-id">

                            <div class="form-row">
                                <label>Fecha de Clase</label>
                                <input id="control-fecha" type="date" required>
                            </div>

                            <div class="form-row">
                                <label>Profesor (Filtrado por Grado)</label>
                                <select id="control-profe">
                                    <option value="">-- Seleccionar Profesor --</option>
                                </select>
                            </div>

                            <div class="form-row">
                                <label>Observaciones</label>
                                <textarea id="control-observ" rows="3" placeholder="Ingresa observaciones de la clase..."></textarea>
                            </div>

                            <div class="form-row">
                                <label>Estatus</label>
                                <select id="control-estatus" required>
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Programada">Programada</option>
                                    <option value="Vista">Vista</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button id="btn-cancelar-control" class="btn-secondary">Cancelar</button>
                        <button id="btn-guardar-control" class="btn-primary">Guardar Cambios</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/views/control.js"></script>
</body>
</html>
