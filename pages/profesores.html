<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesores - Escuela Digital</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../image/EscuelaIco-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../image/EscuelaIco-16x16.png">
    <link rel="shortcut icon" href="../image/EscuelaIco.ico">
    <link rel="apple-touch-icon" href="../image/EscuelaIco-apple.png">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Escuela Digital">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css?v=3.4">
</head>
<body>
    <div class="app-body">
        <main id="main-content" class="app-main">
            <!-- Header de Sección -->
            <div class="header-seccion">
                <div class="header-seccion-main">
                    <span class="header-icon">
                        <svg class="header-icon-svg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <div class="header-seccion-text">
                        <h2>Profesores</h2>
                        <p>Información general y gestión de profesores.</p>
                    </div>
                </div>
                <div class="header-action-container">
                    <button id="btn-nuevo-profesor" class="btn-header-action" aria-label="Añadir">+</button>
                </div>
            </div>

            <!-- Filtros -->
            <div class="filters-bar" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; align-items: center;">
                <div style="width: 220px;">
                    <select id="filter-grado-profesores" class="form-select">
                        <option value="">Todos los Grados</option>
                    </select>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="table-responsive table-profesores-scroll">
                <table class="data-table" id="tabla-profesores">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th style="width: 90px; text-align: center;">Foto</th>
                            <th>Grado</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Estatus</th>
                            <th>Rol</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-profesores-body">
                        <tr>
                            <td colspan="8" class="loading">Consultando Profesores...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Modal Profesor -->
            <div id="modal-profesor" class="modal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modal-profesor-title">Profesor</h3>
                        <button id="modal-profesor-close" class="modal-close">✕</button>
                    </div>
                    <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
                        <form id="form-profesor">
                            <input type="hidden" id="profe-id">
                            <div class="form-row">
                                <label>Nombre Completo *</label>
                                <input id="profe-nombre" type="text" required placeholder="Nombre del profesor">
                            </div>
                            <div class="form-row">
                                <label>Grado Asignado</label>
                                <select id="profe-grado">
                                    <option value="">-- Seleccionar Grado --</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <label>Correo Electrónico</label>
                                <input id="profe-email" type="email" placeholder="profesor@ejemplo.com">
                            </div>
                            <div class="form-row">
                                <label>Teléfono</label>
                                <input id="profe-telf" type="tel" placeholder="Ej: +58 412 0000000">
                            </div>
                            <div class="form-row">
                                <label>Estatus</label>
                                <select id="profe-estatus">
                                    <option value="Activo">Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <label>Rol</label>
                                <input id="profe-rol" type="text" placeholder="Ej: Titular, Auxiliar, Coordinador">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button id="btn-cancelar-profesor" class="btn-secondary">Cancelar</button>
                        <button id="btn-borrar-profesor" class="btn-danger" style="display:none;">Eliminar</button>
                        <button id="btn-guardar-profesor" class="btn-primary">Guardar</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/views/profesores.js"></script>
</body>
</html>
