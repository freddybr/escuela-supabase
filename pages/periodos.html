<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Períodos Académicos - Escuela Digital</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../image/EscuelaIco-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../image/EscuelaIco-16x16.png">
    <link rel="shortcut icon" href="../image/EscuelaIco.ico">
    <link rel="apple-touch-icon" href="../image/EscuelaIco-apple.png">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Escuela Digital">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css?v=3.4">
</head>
<body>
    <div class="app-body">
        <main id="main-content" class="app-main">
            <!-- Header de Sección -->
            <div class="header-seccion">
                <div class="header-seccion-main">
                    <span class="header-icon">
                        <svg class="header-icon-svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    </span>
                    <div class="header-seccion-text">
                        <h2>Períodos</h2>
                        <p>Años académicos por período.</p>
                    </div>
                </div>
                <div class="header-action-container">
                    <button id="btn-nuevo-periodo" class="btn-header-action" aria-label="Añadir">+</button>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="table-responsive table-periodos-scroll">
                <table class="data-table" id="tabla-periodos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Período</th>
                            <th>Fecha Inicio</th>
                            <th>Fecha Fin</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-periodos-body">
                        <tr>
                            <td colspan="4" class="loading">Consultando períodos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Modal Periodos -->
            <div id="modal-periodo" class="modal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modal-periodo-title">Período</h3>
                        <button id="modal-periodo-close" class="modal-close">✕</button>
                    </div>
                    <div class="modal-body">
                        <form id="form-periodo">
                            <input type="hidden" id="periodo-id">
                            
                            <div class="form-row">
                                <label>Nombre del Período (Ej: 2025-2026)</label>
                                <input id="periodo-nombre" type="text" placeholder="Ej. 2025-2026" required>
                            </div>

                            <div class="form-row">
                                <label>Fecha de Inicio</label>
                                <input id="periodo-inicio" type="date" required>
                            </div>

                            <div class="form-row">
                                <label>Fecha de Fin</label>
                                <input id="periodo-fin" type="date" required>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button id="btn-cancelar-periodo" class="btn-secondary">Cancelar</button>
                        <button id="btn-borrar-periodo" class="btn-danger" style="display:none;">Eliminar</button>
                        <button id="btn-guardar-periodo" class="btn-primary">Guardar</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/views/periodos.js"></script>
</body>
</html>
