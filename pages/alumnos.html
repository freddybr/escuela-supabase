<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnos - Escuela Digital</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../image/EscuelaIco-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../image/EscuelaIco-16x16.png">
    <link rel="shortcut icon" href="../image/EscuelaIco.ico">
    <link rel="apple-touch-icon" href="../image/EscuelaIco-apple.png">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Escuela Digital">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css?v=3.4">
</head>
<body>
    <div class="app-body">
        <main id="main-content" class="app-main">
            <!-- Header de Sección -->
            <div class="header-seccion">
                <div class="header-seccion-main">
                    <span class="header-icon">
                        <svg class="header-icon-svg" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </span>
                    <div class="header-seccion-text">
                        <h2>Alumnos</h2>
                        <p>Información general y gestión de alumnos.</p>
                    </div>
                </div>
                <div class="header-action-container">
                    <button id="btn-nuevo-alumno" class="btn-header-action" aria-label="Añadir">+</button>
                </div>
            </div>

            <!-- Filtros -->
            <div class="filters-bar" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; align-items: center;">
                <div style="width: 220px;">
                    <select id="filter-grado-alumnos" class="form-select">
                        <option value="">Todos los Grados</option>
                    </select>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="table-responsive table-alumnos-scroll">
                <table class="data-table" id="tabla-alumnos">
                    <thead> 
                        <tr>
                            <th>ID</th>
                            <th style="width: 90px; text-align: center;">Foto</th>
                            <th>Nombre</th>
                            <th>Grado</th>
                            <th>Email</th>
                            <th>Nacimiento</th>
                            <th>Sexo</th>
                            <th>Representante</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-alumnos-body">
                        <tr>
                            <td colspan="10" class="loading">Consultando Alumnos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Modal Alumno -->
            <div id="modal-alumno" class="modal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modal-alumno-title">Alumno</h3>
                        <button id="modal-alumno-close" class="modal-close">✕</button>
                    </div>
                    <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
                        <form id="form-alumno">
                            <input type="hidden" id="alumno-id">
                            <div class="form-row">
                                <label>Nombre Completo *</label>
                                <input id="alumno-nombre" type="text" required placeholder="Nombre del alumno">
                            </div>
                            <div class="form-row">
                                <label>Grado *</label>
                                <select id="alumno-grado" required>
                                    <option value="">-- Seleccionar Grado --</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <label>Correo Electrónico</label>
                                <input id="alumno-email" type="email" placeholder="correo@ejemplo.com">
                            </div>
                            <div class="form-row">
                                <label>Fecha de Nacimiento</label>
                                <input id="alumno-birthday" type="date">
                            </div>
                            <div class="form-row">
                                <label>Sexo</label>
                                <select id="alumno-sexo">
                                    <option value="">-- Seleccionar Sexo --</option>
                                    <option value="Masculino">Masculino</option>
                                    <option value="Femenino">Femenino</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <label>Representante</label>
                                <input id="alumno-representante" type="text" placeholder="Nombre del representante">
                            </div>
                            <div class="form-row">
                                <label>Teléfono</label>
                                <input id="alumno-telf" type="tel" placeholder="Ej: +58 412 0000000">
                            </div>
                            <div class="form-row">
                                <label>Dirección</label>
                                <textarea id="alumno-direccion" rows="2" placeholder="Dirección de residencia"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button id="btn-cancelar-alumno" class="btn-secondary">Cancelar</button>
                        <button id="btn-borrar-alumno" class="btn-danger" style="display:none;">Eliminar</button>
                        <button id="btn-guardar-alumno" class="btn-primary">Guardar</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/views/alumnos.js"></script>
</body>
</html>
