<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignaciones - Escuela Digital</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../image/EscuelaIco-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../image/EscuelaIco-16x16.png">
    <link rel="shortcut icon" href="../image/EscuelaIco.ico">
    <link rel="apple-touch-icon" href="../image/EscuelaIco-apple.png">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Escuela Digital">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css?v=3.4">
</head>
<body>
    <div class="app-body">
        <main id="main-content" class="app-main">
            <!-- Header de Sección -->
            <div class="header-seccion">
                <div class="header-seccion-main">
                    <span class="header-icon">
                        <svg class="header-icon-svg" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                    </span>
                    <div class="header-seccion-text">
                        <h2>Asignaciones</h2>
                        <p>Distribución de los programas entre los grados.</p>
                    </div>
                </div>
                <div class="header-action-container">
                    <button id="btn-nueva-asignacion" class="btn-header-action" aria-label="Añadir">+</button>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="table-responsive table-asignaciones-scroll">
                <table class="data-table" id="tabla-asignaciones">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th># Prog</th>
                            <th>Programa</th>
                            <th>Grado</th>
                            <th>Estatus</th>
                            <th>Periodo</th>
                            <th>Materia</th>
                            <th># Clases</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-asignaciones-body">
                        <tr>
                            <td colspan="8" class="loading">Consultando Asignaciones...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Modal Asignacion -->
            <div id="modal-asignacion" class="modal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modal-asignacion-title">Asignación</h3>
                        <button id="modal-asignacion-close" class="modal-close">✕</button>
                    </div>
                    <div class="modal-body">
                        <form id="form-asignacion">
                            <input type="hidden" id="asigna-id">
                            
                            <div class="form-row">
                                <label>Programa (Disponible)</label>
                                <select id="asigna-programa" required>
                                    <option value="">-- Seleccionar Programa --</option>
                                </select>
                            </div>

                            <div class="form-row">
                                <label>Grado</label>
                                <select id="asigna-grado" required>
                                    <option value="">-- Seleccionar Grado --</option>
                                </select>
                            </div>

                            <div class="form-row">
                                <label>Periodo (Año)</label>
                                <select id="asigna-anio" required>
                                    <option value="">-- Seleccionar Periodo --</option>
                                </select>
                            </div>

                            <div class="form-row">
                                <label>Estatus de Asignación</label>
                                <select id="asigna-estatus" required>
                                    <option value="Activa">Activa</option>
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Terminada">Terminada</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button id="btn-cancelar-asignacion" class="btn-secondary">Cancelar</button>
                        <button id="btn-borrar-asignacion" class="btn-danger" style="display:none;">Eliminar</button>
                        <button id="btn-guardar-asignacion" class="btn-primary">Guardar</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/views/asignaciones.js"></script>
</body>
</html>
