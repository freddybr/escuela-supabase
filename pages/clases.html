<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clases - Escuela Digital</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../image/EscuelaIco-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../image/EscuelaIco-16x16.png">
    <link rel="shortcut icon" href="../image/EscuelaIco.ico">
    <link rel="apple-touch-icon" href="../image/EscuelaIco-apple.png">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Escuela Digital">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/app.css?v=3.4">
</head>
<body>
    <div class="app-body">
        <main id="main-content" class="app-main">
            <!-- Header de Sección -->
            <div class="header-seccion">
                <div class="header-seccion-main">
                    <span class="header-icon">
                        <svg class="header-icon-svg" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    </span>
                    <div class="header-seccion-text">
                        <h2>Clases</h2>
                        <p>Listado General de Clases.</p>
                    </div>
                </div>
            </div>

            <!-- Barra de Filtros -->
            <div class="filters-bar filters-bar-small" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; align-items: center;">
                <div style="flex: 1 1 240px; min-width: 140px;">
                    <input 
                        type="text" 
                        id="filter-search-clases" 
                        class="form-control" 
                        placeholder="Buscar Número, Tema, Objetivo, Texto..." 
                    >
                </div>
                <div style="width: 220px;">
                    <select id="filter-programa-clases" class="form-select">
                        <option value="">Programas</option>
                    </select>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="table-responsive table-clases-scroll">
                <table class="data-table" id="tabla-clases">
                    <thead>
                        <tr>
                            <th>Num</th>
                            <th>Tema</th>
                            <th>Objetivo</th>
                            <th>Texto</th>
                            <th>Programa</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-clases-body">
                        <tr>
                            <td colspan="5" class="loading">Consultando Clases...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/views/clases.js"></script>
</body>
</html>
